name: farmnex_flutter
description: "FarmNex — direct farmer-to-buyer mandi marketplace with live APMC prices, pre-harvest bidding, AI price forecasts, and crop rescue."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.11.1
  http: ^1.5.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  google_mlkit_translation: ^0.10.0
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.2
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/branding/
    - assets/farm/
    - assets/html_reference/

