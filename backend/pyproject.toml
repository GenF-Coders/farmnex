[project]
name = "farmnex-backend"
version = "0.1.0"
description = "FarmNex FastAPI backend"
requires-python = ">=3.11,<3.15"

dependencies = [
    "fastapi[standard]>=0.141,<1.0",
    "uvicorn>=0.53,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "asyncpg>=0.31,<1.0",
    "argon2-cffi>=25.1,<26.0",
    "PyJWT>=2.14,<3.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.15,<3.0",
    "python-dotenv>=1.2,<2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["secrets*"]