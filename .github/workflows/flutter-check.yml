name: Flutter check

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/flutter-check.yml"
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Analyze is reported but does not fail the job: the team wants the list of findings first.
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test
      - name: Keep the regenerated lock file
        uses: actions/upload-artifact@v4
        with:
          name: pubspec.lock
          path: frontend/pubspec.lock
